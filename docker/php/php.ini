memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 8M
max_execution_time = 60
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

apc.enabled = 1
apc.enable_cli = 1
apc.shm_size = 64M
